name: Poshmark
description: 'Poshmark is a social commerce marketplace where people in the US, Canada,
  Australia and India buy and sell new and secondhand fashion, accessories, home goods,
  beauty products, and electronics. Sellers list items from their closets, share and
  cross-promote listings across the community, host live selling shows, and ship using
  prepaid labels while Poshmark handles payments and buyer protection. Founded 2011,
  IPO 2021, acquired by Naver in 2023. Poshmark runs a consumer web and mobile
  marketplace backed by internal APIs but does not publish a public developer API,
  SDK, or developer portal; this profile captures its public web, security, and
  identity surface for the API Evangelist network.'
